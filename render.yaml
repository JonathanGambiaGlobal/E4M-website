services:
  - type: web
    name: estate4mission-demo
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disks:
      - name: estate4mission-data
        mountPath: /var/data
        sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
